<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collection | SAMSUC Resource Hub</title>
  <meta name="description" content="Browse all SAMSUC digital resources for students, churches, and creators." />
  <link rel="canonical" href="https://samsuc.github.io/resource-hub/collection/" />
  <link rel="icon" type="image/png" href="../media/favicon-32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#07090f;--elev:#0e1320;--surface:#141b2d;--text:#f0f2f8;--muted:#8b93a7;--gold:#d4a017;--border:rgba(255,255,255,.08);--header-h:64px}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
    a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
    .header{position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(7,9,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .logo{font-family:'Space Grotesk',sans-serif;font-weight:700}.logo span{color:var(--gold);font-size:.72rem;margin-left:6px}
    .nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{font-size:.88rem;color:var(--muted);padding:8px 12px;border-radius:999px}.nav a:hover,.nav a.active{color:var(--text);background:rgba(255,255,255,.06)}
    .hero{padding:56px 24px 28px;text-align:center}.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:10px}
    .hero p{color:var(--muted);max-width:32em;margin:0 auto}
    .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 24px 28px}
    .filter-btn{border:1px solid var(--border);background:var(--elev);color:var(--muted);font:inherit;font-size:.85rem;font-weight:600;padding:10px 16px;border-radius:999px;cursor:pointer}
    .filter-btn.active,.filter-btn:hover{color:var(--text);border-color:rgba(212,160,23,.35);background:rgba(212,160,23,.08)}
    .grid{max-width:1100px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
    .card{border:1px solid var(--border);border-radius:18px;background:var(--elev);overflow:hidden;display:flex;flex-direction:column}
    .card img{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--surface)}
    .card .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .cat{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
    .card h2{font-family:'Space Grotesk',sans-serif;font-size:1.05rem}
    .card p{color:var(--muted);font-size:.9rem;flex:1}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
    .price{font-weight:700;color:var(--gold)}
    .btn{display:inline-flex;padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:700;background:linear-gradient(135deg,var(--gold),#b8860b);color:#0a0a0a}
    .status{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
    footer{border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--muted);font-size:.85rem}
  </style>
</head>
<body>
  <header class="header">
    <a href="../" class="logo">SAMSUC <span>Resource Hub</span></a>
    <nav class="nav">
      <a href="../">Home</a>
      <a href="../collection/" class="active">Collection</a>
      <a href="../contact/">Contact</a>
      <a href="../support/">Support</a>
    </nav>
  </header>
  <div class="hero">
    <h1>The Collection</h1>
    <p>Every resource currently available — students, churches, and creators.</p>
  </div>
  <div class="filters" id="filters">
    <button type="button" class="filter-btn active" data-f="all">All</button>
    <button type="button" class="filter-btn" data-f="students">Students</button>
    <button type="button" class="filter-btn" data-f="churches">Churches</button>
    <button type="button" class="filter-btn" data-f="creators">Creators</button>
  </div>
  <div class="grid" id="grid"><p class="status">Loading…</p></div>
  <footer>© 2026 SAMSUC Resource Hub · <a href="../">Home</a></footer>
  <script src="https://gumroad.com/js/gumroad.js" defer></script>
  <script>
  (function(){
    var API=['https://','samsuc-products','.','samsuc34','.','workers','.','dev'].join('');
    var PRODUCTS=[], filter='all';
    var params=new URLSearchParams(location.search);
    if(params.get('c')) filter=params.get('c');
    function infer(n,p){var s=((n||'')+' '+(p||'')).toLowerCase();if(/jamb|student|chemistry|exam/.test(s))return'students';if(/church|livestream|media|obs/.test(s))return'churches';return'creators';}
    function map(p){var url=p.url||'',per=p.permalink;if(!per&&url){var m=String(url).match(/\/l\/([^/?#]+)/);if(m)per=m[1];}
      var c=typeof p.price_cents==='number'?p.price_cents:0;
      var d=(p.description||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      return{name:p.name||per,desc:d.slice(0,160),price:Math.round(c)/100,category:infer(p.name,per),image:p.thumbnail_url||'',gumroadUrl:url||(per?'https://samsuchub.gumroad.com/l/'+per:'')};}
    function trunc(s,m){s=String(s||'').trim();if(s.length<=m)return s;var c=s.slice(0,m-1);var i=c.lastIndexOf(' ');if(i>m*0.5)c=c.slice(0,i);return c+'…';}
    function money(p){if(!p||!p.price)return'Free';try{return new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(p.price);}catch(e){return'$'+p.price;}}
    function render(){
      var list=filter==='all'?PRODUCTS:PRODUCTS.filter(function(p){return p.category===filter;});
      var g=document.getElementById('grid');
      if(!list.length){g.innerHTML='<p class="status">No products in this category yet.</p>';return;}
      g.innerHTML=list.map(function(p){
        var cat=p.category==='students'?'Students':p.category==='churches'?'Churches':'Creators';
        return '<article class="card"><a href="'+p.gumroadUrl+'"><img src="'+(p.image||'https://placehold.co/800x500/141b2d/d4a017?text=SAMSUC')+'" alt="" loading="lazy" referrerpolicy="no-referrer"/></a><div class="body"><div class="cat">'+cat+'</div><h2><a href="'+p.gumroadUrl+'">'+p.name+'</a></h2><p>'+trunc(p.desc,120)+'</p><div class="meta"><span class="price">'+money(p)+'</span><a class="btn" href="'+p.gumroadUrl+'" data-gumroad-overlay-checkout="true">'+(p.price===0?'Get free':'Get it')+'</a></div></div></article>';
      }).join('');
    }
    document.getElementById('filters').addEventListener('click',function(e){
      var b=e.target.closest('.filter-btn');if(!b)return;
      filter=b.getAttribute('data-f')||'all';
      document.querySelectorAll('.filter-btn').forEach(function(x){x.classList.toggle('active',x===b);});
      render();
    });
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-f')===filter);});
    fetch(API,{credentials:'omit',cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      if(d&&d.success&&d.products&&d.products.length) PRODUCTS=d.products.map(map).filter(function(p){return p.gumroadUrl;});
      render();
    }).catch(function(){render();});
  })();
  </script>
</body>
</html>
