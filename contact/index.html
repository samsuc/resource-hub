<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | SAMSUC Resource Hub</title>
  <meta name="description" content="Contact SAMSUC Resource Hub about a digital resource or a download." />
  <link rel="canonical" href="https://samsuc.github.io/resource-hub/contact/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Contact | SAMSUC Resource Hub" />
  <meta property="og:description" content="Contact SAMSUC Resource Hub about a digital resource or a download." />
  <meta property="og:url" content="https://samsuc.github.io/resource-hub/contact/" />
  <meta property="og:image" content="https://samsuc.github.io/resource-hub/media/og-share.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://samsuc.github.io/resource-hub/media/og-share.png" />
  <link rel="icon" type="image/png" href="../media/favicon-32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#07090f;--elev:#0e1320;--surface:#141b2d;--text:#f0f2f8;--muted:#8b93a7;--gold:#d4a017;--border:rgba(255,255,255,.08)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    a{color:inherit;text-decoration:none}
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #e8c547; outline-offset: 3px; }
    .header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border)}
    .logo{font-family:'Space Grotesk',sans-serif;font-weight:700}.logo span{color:var(--gold);font-size:.72rem;margin-left:6px}
    .nav a{margin-left:12px;color:var(--muted);font-size:.9rem}.nav a:hover{color:var(--text)}
    main{max-width:560px;margin:0 auto;padding:48px 24px 80px}
    h1{font-family:'Space Grotesk',sans-serif;font-size:2rem;margin-bottom:10px}
    .lead{color:var(--muted);margin-bottom:28px}
    label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px}
    input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;margin-bottom:14px}
    textarea{min-height:140px;resize:vertical}
    button{width:100%;padding:14px;border:0;border-radius:999px;font-weight:700;font-size:.95rem;cursor:pointer;background:linear-gradient(135deg,var(--gold),#b8860b);color:#0a0a0a}
    .ok{display:none;color:var(--gold);margin-top:12px}
    footer{text-align:center;padding:24px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border)}
  </style>
</head>
<body>
  <header class="header">
    <a href="../" class="logo">SAMSUC <span>Resource Hub</span></a>
    <nav class="nav"><a href="../">Home</a><a href="../collection/">Collection</a><a href="../support/">Support</a></nav>
  </header>
  <main>
    <h1>Contact</h1>
    <p class="lead">Questions about a resource or your download? Send a message.</p>
    <form id="f" action="https://formspree.io/f/mvkpqvar" method="POST">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required placeholder="you@email.com" />
      <label for="msg">Message</label>
      <textarea id="msg" name="message" required placeholder="How can we help?"></textarea>
      <button type="submit">Send message</button>
      <p class="ok" id="ok">Message sent. We’ll get back to you soon.</p>
    </form>
  </main>
  <footer>© 2026 SAMSUC Resource Hub</footer>
  <script>
    document.getElementById('f').addEventListener('submit',async function(e){
      e.preventDefault();
      var btn=this.querySelector('button');btn.disabled=true;btn.textContent='Sending…';
      try{
        var r=await fetch(this.action,{method:'POST',body:new FormData(this),headers:{Accept:'application/json'}});
        if(r.ok){this.reset();document.getElementById('ok').style.display='block';btn.style.display='none';}
        else{btn.disabled=false;btn.textContent='Try again';}
      }catch(err){btn.disabled=false;btn.textContent='Send message';}
    });
  </script>
</body>
</html>
