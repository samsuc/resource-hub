<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SAMSUC Resource Hub | Digital Resources for Students, Churches & Creators</title>
<meta name="description" content="Premium digital resources for students, churches, and creators. Study materials, church media tools, and website templates."/>
<link rel="canonical" href="https://samsuc.github.io/resource-hub/"/>
<link rel="icon" type="image/png" href="media/favicon-32.png"/>
<meta http-equiv="refresh" content="0;url=collection/"/>
<link rel="preload" href="media/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url("media/fonts/inter-latin.woff2") format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:300 700;font-display:swap;src:url("media/fonts/space-grotesk-latin.woff2") format("woff2")}
:root{--bg:#07090f;--text:#f0f2f8;--muted:#8b93a7;--gold:#d4a017;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:480px;text-align:center;border:1px solid var(--border);border-radius:20px;padding:40px 28px;background:#0e1320}
h1{font-family:"Space Grotesk",sans-serif;font-size:1.8rem;margin-bottom:12px}
p{color:var(--muted);margin-bottom:24px}
a.btn{display:inline-flex;padding:14px 24px;border-radius:999px;background:linear-gradient(135deg,var(--gold),#b8860b);color:#0a0a0a;font-weight:700;text-decoration:none}
.links{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.links a{color:var(--gold);font-size:.9rem}
</style>
</head>
<body>
<div class="card">
  <h1>SAMSUC Resource Hub</h1>
  <p>Redirecting to the shop. If nothing happens, use the links below.</p>
  <a class="btn" href="collection/">Browse the collection</a>
  <div class="links">
    <a href="students-resources/">Students</a>
    <a href="church-media/">Churches</a>
    <a href="creators-resources/">Creators</a>
    <a href="website-templates/">Templates</a>
  </div>
</div>
<script>location.replace("collection/");</script>
</body>
</html>
